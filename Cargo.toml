[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = 3
debug = false
lto = "thin"

# the maths (curve preparation, orbits) runs every frame of an animation: keep it fast in test builds too
[profile.dev.package.gf-core]
opt-level = 2
